<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2rem 1rem;
    background: #f4f4f8;
    color: #222;
  }
  #status { font-size: 1.3rem; margin: 1rem 0; min-height: 1.6em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
  }
  .cell {
    background: #fff;
    border: none;
    border-radius: 8px;
    font-size: 3rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .cell:disabled { cursor: default; }
  .cell.X { color: #d33; }
  .cell.O { color: #27a; }
  .cell.win { background: #cfe8cf; }
  button#reset {
    margin-top: 1.5rem;
    padding: .6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  #score { margin-top: 1rem; color: #555; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status"></div>
  <div id="board"></div>
  <div id="score"></div>
  <button id="reset">New game</button>

<script>
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreEl = document.getElementById('score');
  const score = { X: 0, O: 0, draws: 0 };
  let board, player, over;

  const cells = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => play(i));
    boardEl.appendChild(b);
    return b;
  });

  function start() {
    board = Array(9).fill('');
    player = 'X';
    over = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; c.disabled = false; });
    statusEl.textContent = "X's turn";
    renderScore();
  }

  function renderScore() {
    scoreEl.textContent = `X: ${score.X}  ·  O: ${score.O}  ·  Draws: ${score.draws}`;
  }

  function play(i) {
    if (over || board[i]) return;
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add(player);
    cells[i].disabled = true;

    const line = LINES.find(l => l.every(k => board[k] === player));
    if (line) {
      over = true;
      line.forEach(k => cells[k].classList.add('win'));
      cells.forEach(c => c.disabled = true);
      score[player]++;
      statusEl.textContent = `${player} wins!`;
    } else if (board.every(Boolean)) {
      over = true;
      score.draws++;
      statusEl.textContent = "It's a draw!";
    } else {
      player = player === 'X' ? 'O' : 'X';
      statusEl.textContent = `${player}'s turn`;
    }
    renderScore();
  }

  document.getElementById('reset').addEventListener('click', start);
  start();
</script>
</body>
</html>
