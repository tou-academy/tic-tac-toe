<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2rem 1rem;
    background: #f4f4f8;
    color: #222;
  }
  #difficulty { margin-bottom: .5rem; }
  #difficulty select { font-size: 1rem; padding: .3rem; }
  #status { font-size: 1.3rem; margin: 1rem 0; min-height: 1.6em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
  }
  .cell {
    background: #fff;
    border: none;
    border-radius: 8px;
    font-size: 3rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .cell:disabled { cursor: default; }
  .cell.X { color: #d33; }
  .cell.O { color: #27a; }
  .cell.win { background: #cfe8cf; }
  button#reset {
    margin-top: 1.5rem;
    padding: .6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  #score { margin-top: 1rem; color: #555; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="difficulty">
    <label>Difficulty:
      <select id="level">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard (unbeatable)</option>
      </select>
    </label>
  </div>
  <div id="status"></div>
  <div id="board"></div>
  <div id="score"></div>
  <button id="reset">New game</button>

<script>
  const HUMAN = 'X', CPU = 'O';
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const score = { X: 0, O: 0, draws: 0 };
  let board, over, thinking;

  const cells = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => humanMove(i));
    boardEl.appendChild(b);
    return b;
  });

  // ---- game logic ----
  function winnerLine(b) {
    return LINES.find(l => b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) || null;
  }
  const emptyCells = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);

  // ---- computer player ----
  function randomMove(b) {
    const e = emptyCells(b);
    return e[Math.floor(Math.random() * e.length)];
  }

  // Win if possible, otherwise block the human's win, otherwise null.
  function winOrBlock(b) {
    for (const p of [CPU, HUMAN]) {
      for (const i of emptyCells(b)) {
        b[i] = p;
        const w = winnerLine(b);
        b[i] = '';
        if (w) return i;
      }
    }
    return null;
  }

  // Minimax: +10 CPU win, -10 human win, 0 draw; depth favours faster wins.
  function minimax(b, player, depth) {
    const w = winnerLine(b);
    if (w) return b[w[0]] === CPU ? 10 - depth : depth - 10;
    const e = emptyCells(b);
    if (!e.length) return 0;
    let best = player === CPU ? -Infinity : Infinity;
    for (const i of e) {
      b[i] = player;
      const s = minimax(b, player === CPU ? HUMAN : CPU, depth + 1);
      b[i] = '';
      best = player === CPU ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function bestMove(b) {
    let bestScore = -Infinity, moves = [];
    for (const i of emptyCells(b)) {
      b[i] = CPU;
      const s = minimax(b, HUMAN, 1);
      b[i] = '';
      if (s > bestScore) { bestScore = s; moves = [i]; }
      else if (s === bestScore) moves.push(i);
    }
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function chooseMove(b) {
    switch (levelEl.value) {
      case 'easy':   return randomMove(b);
      case 'medium': {
        const m = winOrBlock(b);
        // Win/block when it sees one, but misses ~30% of the time.
        if (m !== null && Math.random() < 0.7) return m;
        return randomMove(b);
      }
      default:       return bestMove(b);
    }
  }

  // ---- UI flow ----
  function start() {
    board = Array(9).fill('');
    over = false;
    thinking = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; c.disabled = false; });
    statusEl.textContent = 'Your turn (X)';
    renderScore();
  }

  function renderScore() {
    scoreEl.textContent = `You: ${score.X}  ·  Computer: ${score.O}  ·  Draws: ${score.draws}`;
  }

  function place(i, p) {
    board[i] = p;
    cells[i].textContent = p;
    cells[i].classList.add(p);
    cells[i].disabled = true;

    const line = winnerLine(board);
    if (line) {
      over = true;
      line.forEach(k => cells[k].classList.add('win'));
      cells.forEach(c => c.disabled = true);
      score[p]++;
      statusEl.textContent = p === HUMAN ? 'You win!' : 'Computer wins!';
    } else if (board.every(Boolean)) {
      over = true;
      score.draws++;
      statusEl.textContent = "It's a draw!";
    }
    renderScore();
  }

  function humanMove(i) {
    if (over || thinking || board[i]) return;
    place(i, HUMAN);
    if (over) return;
    thinking = true;
    statusEl.textContent = 'Computer is thinking…';
    setTimeout(() => {
      if (over || !thinking) return;
      place(chooseMove(board), CPU);
      thinking = false;
      if (!over) statusEl.textContent = 'Your turn (X)';
    }, 350);
  }

  document.getElementById('reset').addEventListener('click', start);
  levelEl.addEventListener('change', () => { score.X = score.O = score.draws = 0; start(); });
  start();
</script>
</body>
</html>
