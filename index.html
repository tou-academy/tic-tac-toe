<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2rem 1rem;
    background: #f4f4f8;
    color: #222;
  }
  [hidden] { display: none !important; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 1.2rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
    width: min(100%, 340px);
    box-sizing: border-box;
  }
  .card input {
    display: block; width: 100%; box-sizing: border-box;
    margin: .5rem 0; padding: .6rem; font-size: 1rem;
    border: 1px solid #ccc; border-radius: 6px;
  }
  .row { display: flex; gap: .5rem; }
  .row button { flex: 1; }
  button.btn {
    padding: .6rem 1rem; font-size: 1rem; border: none; border-radius: 6px;
    background: #333; color: #fff; cursor: pointer;
  }
  button.btn.secondary { background: #ddd; color: #222; }
  #msg { margin-top: .6rem; min-height: 1.2em; font-size: .9rem; color: #b00; }
  #msg.ok { color: #2a7a2a; }
  #topbar { display: flex; gap: .8rem; align-items: center; margin-bottom: 1rem; font-size: .9rem; }
  #difficulty select { font-size: 1rem; padding: .3rem; }
  #status { font-size: 1.3rem; margin: 1rem 0; min-height: 1.6em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
  }
  .cell {
    background: #fff; border: none; border-radius: 8px;
    font-size: 3rem; font-weight: bold; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .cell:disabled { cursor: default; }
  .cell.X { color: #d33; }
  .cell.O { color: #27a; }
  .cell.win { background: #cfe8cf; }
  #score { margin: 1rem 0; color: #555; }
  #games { margin-top: 1.5rem; }
  #games h2 { font-size: 1.1rem; margin: 0 0 .5rem; }
  #games ul { list-style: none; margin: 0; padding: 0; }
  #games li {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    padding: .5rem 0; border-top: 1px solid #eee; font-size: .9rem;
  }
  #games li button { padding: .3rem .7rem; font-size: .85rem; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>

  <!-- Login / sign up -->
  <section id="auth" class="card" hidden>
    <strong>Log in to play</strong>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" minlength="6" required>
      <div class="row">
        <button class="btn" type="submit" id="loginBtn">Log in</button>
        <button class="btn secondary" type="button" id="signupBtn">Sign up</button>
      </div>
    </form>
    <div id="msg"></div>
  </section>

  <!-- Game -->
  <section id="app" hidden style="display:flex;flex-direction:column;align-items:center;width:100%">
    <div id="topbar">
      <span id="who"></span>
      <button class="btn secondary" id="logout">Log out</button>
    </div>
    <div id="difficulty">
      <label>Difficulty:
        <select id="level">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard (unbeatable)</option>
        </select>
      </label>
    </div>
    <div id="status"></div>
    <div id="board"></div>
    <div id="score"></div>
    <button class="btn" id="reset">New game</button>

    <div id="games" class="card">
      <h2>My games</h2>
      <ul id="gameList"></ul>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  const HUMAN = 'X', CPU = 'O';
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), statusEl = $('status'), scoreEl = $('score'), levelEl = $('level');
  const msgEl = $('msg'), authEl = $('auth'), appEl = $('app');

  let sb, user = null;
  let board, over, thinking, gameId;

  const cells = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => humanMove(i));
    boardEl.appendChild(b);
    return b;
  });

  // ---- game logic ----
  function winnerLine(b) {
    return LINES.find(l => b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) || null;
  }
  const emptyCells = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const encode = b => b.map(v => v || '-').join('');
  const decode = s => s.split('').map(c => c === '-' ? '' : c);
  function statusOf(b) {
    const w = winnerLine(b);
    if (w) return b[w[0]] === HUMAN ? 'won' : 'lost';
    return b.every(Boolean) ? 'draw' : 'in_progress';
  }

  // ---- computer player ----
  function randomMove(b) {
    const e = emptyCells(b);
    return e[Math.floor(Math.random() * e.length)];
  }

  // Win if possible, otherwise block the human's win, otherwise null.
  function winOrBlock(b) {
    for (const p of [CPU, HUMAN]) {
      for (const i of emptyCells(b)) {
        b[i] = p;
        const w = winnerLine(b);
        b[i] = '';
        if (w) return i;
      }
    }
    return null;
  }

  // Minimax: +10 CPU win, -10 human win, 0 draw; depth favours faster wins.
  function minimax(b, player, depth) {
    const w = winnerLine(b);
    if (w) return b[w[0]] === CPU ? 10 - depth : depth - 10;
    const e = emptyCells(b);
    if (!e.length) return 0;
    let best = player === CPU ? -Infinity : Infinity;
    for (const i of e) {
      b[i] = player;
      const s = minimax(b, player === CPU ? HUMAN : CPU, depth + 1);
      b[i] = '';
      best = player === CPU ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }

  function bestMove(b) {
    let bestScore = -Infinity, moves = [];
    for (const i of emptyCells(b)) {
      b[i] = CPU;
      const s = minimax(b, HUMAN, 1);
      b[i] = '';
      if (s > bestScore) { bestScore = s; moves = [i]; }
      else if (s === bestScore) moves.push(i);
    }
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function chooseMove(b) {
    switch (levelEl.value) {
      case 'easy':   return randomMove(b);
      case 'medium': {
        const m = winOrBlock(b);
        // Win/block when it sees one, but misses ~30% of the time.
        if (m !== null && Math.random() < 0.7) return m;
        return randomMove(b);
      }
      default:       return bestMove(b);
    }
  }

  // ---- saving to Supabase ----
  // The game row is created on the player's first move, then updated after every move.
  async function save() {
    const fields = {
      board: encode(board),
      difficulty: levelEl.value,
      status: statusOf(board),
      updated_at: new Date().toISOString()
    };
    let error;
    if (!gameId) {
      let data;
      ({ data, error } = await sb.from('games').insert(fields).select('id').single());
      if (data) gameId = data.id;
    } else {
      ({ error } = await sb.from('games').update(fields).eq('id', gameId));
    }
    if (error) {
      statusEl.textContent = 'Could not save game: ' + error.message;
      return false;
    }
    return true;
  }

  async function loadGames() {
    const { data, error } = await sb.from('games').select('*').order('updated_at', { ascending: false }).limit(50);
    const list = $('gameList');
    list.innerHTML = '';
    if (error) { list.textContent = 'Could not load games: ' + error.message; return; }

    const count = s => data.filter(g => g.status === s).length;
    scoreEl.textContent = `Wins: ${count('won')}  ·  Losses: ${count('lost')}  ·  Draws: ${count('draw')}`;

    if (!data.length) { list.innerHTML = '<li>No games yet. Make a move to start one!</li>'; return; }
    const label = { in_progress: 'In progress', won: 'You won', lost: 'Computer won', draw: 'Draw' };
    for (const g of data) {
      const li = document.createElement('li');
      const info = document.createElement('span');
      info.textContent = `${new Date(g.updated_at).toLocaleString()} · ${g.difficulty} · ${label[g.status]}`;
      const btn = document.createElement('button');
      btn.className = 'btn secondary';
      btn.textContent = g.status === 'in_progress' ? 'Continue' : 'View';
      btn.addEventListener('click', () => openGame(g));
      li.append(info, btn);
      list.appendChild(li);
    }
  }

  // ---- UI flow ----
  function renderBoard() {
    const line = winnerLine(board);
    cells.forEach((c, i) => {
      c.textContent = board[i];
      c.className = 'cell' + (board[i] ? ' ' + board[i] : '') + (line && line.includes(i) ? ' win' : '');
      c.disabled = over || !!board[i];
    });
  }

  function showResult() {
    const s = statusOf(board);
    statusEl.textContent = { won: 'You win!', lost: 'Computer wins!', draw: "It's a draw!" }[s] || 'Your turn (X)';
  }

  function newGame() {
    board = Array(9).fill('');
    over = false;
    thinking = false;
    gameId = null;
    renderBoard();
    showResult();
  }

  function openGame(g) {
    board = decode(g.board);
    gameId = g.id;
    levelEl.value = g.difficulty;
    over = g.status !== 'in_progress';
    thinking = false;
    renderBoard();
    showResult();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // The page may have been closed right after the player moved: let the computer reply.
    const xs = board.filter(v => v === HUMAN).length, os = board.filter(v => v === CPU).length;
    if (!over && xs > os) cpuTurn();
  }

  async function cpuTurn() {
    thinking = true;
    statusEl.textContent = 'Computer is thinking…';
    await new Promise(r => setTimeout(r, 350));
    if (!thinking) return;           // a different game was opened meanwhile
    board[chooseMove(board)] = CPU;
    over = statusOf(board) !== 'in_progress';
    renderBoard();
    showResult();
    thinking = false;
    await save();
    loadGames();
  }

  async function humanMove(i) {
    if (over || thinking || board[i]) return;
    board[i] = HUMAN;
    over = statusOf(board) !== 'in_progress';
    thinking = true;                 // block clicks while saving
    renderBoard();
    showResult();
    const ok = await save();
    thinking = false;
    if (!ok) return;
    if (over) { loadGames(); return; }
    cpuTurn();
  }

  // ---- auth ----
  function showMsg(text, ok) { msgEl.textContent = text; msgEl.className = ok ? 'ok' : ''; }

  async function render() {
    authEl.hidden = !!user;
    appEl.hidden = !user;
    if (user) {
      $('who').textContent = user.email;
      newGame();
      loadGames();
    }
  }

  async function init() {
    if (!window.supabase || window.SUPABASE_URL.startsWith('YOUR_')) {
      authEl.hidden = false;
      $('authForm').hidden = true;
      showMsg('Supabase is not set up yet. Fill in config.js (see SETUP.md).');
      return;
    }
    sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    $('authForm').addEventListener('submit', async e => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
      showMsg(error ? error.message : '');
    });
    $('signupBtn').addEventListener('click', async () => {
      if (!$('authForm').reportValidity()) return;
      const { data, error } = await sb.auth.signUp({ email: $('email').value, password: $('password').value });
      if (error) showMsg(error.message);
      else if (!data.session) showMsg('Account created! Check your email to confirm, then log in.', true);
    });
    $('logout').addEventListener('click', () => sb.auth.signOut());
    $('reset').addEventListener('click', newGame);
    levelEl.addEventListener('change', () => { if (gameId && !over) save(); });

    sb.auth.onAuthStateChange((_event, session) => {
      const newUser = session ? session.user : null;
      if ((newUser && newUser.id) === (user && user.id)) return;   // ignore token refreshes
      user = newUser;
      render();
    });
    const { data } = await sb.auth.getSession();
    if (!user && data.session) { user = data.session.user; render(); }
    else if (!user) render();
  }

  init();
</script>
</body>
</html>
